name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  quality:
    name: Code quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: npm ci
        working-directory: frontend
      - name: Lint Python
        run: python -m ruff check backend
      - name: Check formatting of changed Python files
        env:
          FORMAT_BASE: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
        run: python scripts/check_python_format.py
      - name: Check frontend formatting
        run: npm run format:check
        working-directory: frontend
      - name: Check TypeScript and build frontend
        run: npm run build
        working-directory: frontend

  backend:
    name: Backend tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: murshrut_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d murshrut_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/murshrut_test
      TEST_REPOSITORY_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/murshrut_test
      DEMO_MODE: "true"
      EVENT_PROVIDER: demo
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - name: Apply migrations to a fresh PostgreSQL database
        run: alembic upgrade head
        working-directory: backend
      - name: Check migrations match models
        run: alembic check
        working-directory: backend
      - name: Run unit, API, architecture and repository tests
        run: python -m pytest backend/tests -q --junitxml=test-results/backend.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  docker:
    name: Docker and browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: "true"
      COMPOSE_PROJECT_NAME: murshrut-ci
      APP_PORT: "8080"
      DEMO_MODE: "true"
      EVENT_PROVIDER: demo
      TEST_BASE_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build application images
        run: docker compose build
      - name: Start stack and wait for healthy services
        run: docker compose up -d --wait --wait-timeout 180
      - name: Smoke test through Nginx
        run: |
          curl --fail --silent --show-error --max-time 15 http://localhost:8080/ > /tmp/frontend.html
          test -s /tmp/frontend.html
          curl --fail --silent --show-error --max-time 15 http://localhost:8080/api/health
          curl --fail --silent --show-error --max-time 15 http://localhost:8080/api/v1/config
      - name: Run browser tests
        run: npm run test:e2e
        working-directory: frontend
      - name: Collect container logs
        if: always()
        run: |
          mkdir -p test-results
          docker compose ps --all > test-results/compose-status.txt
          docker compose logs --no-color > test-results/compose.log 2>&1
      - name: Upload Docker logs and browser reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-and-browser-results
          path: |
            test-results/
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop stack and remove test data
        if: always()
        run: docker compose down --volumes --remove-orphans
